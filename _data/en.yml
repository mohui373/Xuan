core_question:
  title: When circumstances change how people pursue their goals, how do they interpret the situation and adjust their actions?
  keywords: Goal commitment after reassignment, employee responses to AI-driven layoffs, and rule compliance under moral reminders.

research:
  intro: Across these projects, I examine how motivation and cognitive appraisal influence judgment, attitudes, and behavior when people encounter social norms, frustration, constrained choices, or organizational change.
  streams:
    - number: "01"
      slug: reassignment-setback
      title: Frustration, Persuasion & Goal Pursuit
      study_title: Reassignment-Related Frustration, Self-Persuasion & Goal Commitment
      paper_title: "Reassignment-Related Frustration: Why Self-Persuasion Works Better Because of Greater Conviction in One's Own Reasons"
      status: Under Review
      status_key: review
      question: When an original goal can no longer be pursued, how do people recommit to an alternative goal they did not initially choose?
      summary: This work compares self-persuasion with other-persuasion to examine how people rebuild goal commitment, confidence, and sustained effort after reassignment-related frustration.
      design:
        - Three preregistered experiments comparing self-persuasion, other-persuasion, and control conditions
        - Student-organization role reassignment in Experiment 1; Hamlet theater-role reassignment in Experiments 2 and 3
        - Adapted Charging Tasks in Experiments 1 and 2; an adapted Slider Task in Experiment 3
        - Goal commitment, retention intention for the assigned role, perceived argument quality, confidence, and hope
      diagram:
        - Reassignment-related frustration
        - Self-persuasion
        - Perceived argument quality
        - Confidence and hope
        - Goal commitment and sustained effort
      findings:
        - Across three experiments, self-persuasion was more effective than other-persuasion in promoting goal commitment after reassignment-related frustration and increased retention intention for the assigned role.
        - Mediation analyses suggested pathways involving perceived argument quality, confidence, and hope. Perceived argument quality reflects participants' subjective evaluations, not an objective assessment of the reasons.
        - Moderation analyses indicated a clearer benefit of self-persuasion at moderate to high levels of work passion; no clear advantage was observed at low levels.
      limitations: The evidence comes from simulated reassignment scenarios. Mediation and moderation results must be interpreted in light of each experiment's design; statistical pathways alone do not establish causal mechanisms or long-term changes following real academic or workplace reassignment.
      note: Three preregistered experiments; the manuscript is under review.
      osf_url: https://osf.io/uke2j
      osf_label: View the preregistration and materials on OSF

    - number: "02"
      slug: distilled-colleague
      title: AI, Organizational Change & Employee Behavior
      study_title: The Distilled Colleague
      paper_title: "The Distilled Colleague: How AI Knowledge Distillation-Driven Layoffs Shape Survivor Attitudes and Knowledge Hiding"
      status: Under Review
      status_key: review
      question: When a colleague's knowledge is distilled into an AI agent but their position is eliminated, how do layoff survivors evaluate the organization and respond to subsequent requests for knowledge?
      summary: This study examines a situation in which an organization encodes a colleague's experience, judgment rules, and work procedures into an AI agent, retaining their knowledge while eliminating their position. A preregistered immersive scenario experiment compared this arrangement with conventional layoffs. Here, “distillation” is a metaphor for the encoding of experience and job replacement, not a specific model-training technique.
      design:
        - One preregistered immersive scenario experiment with a two-condition between-subjects design
        - Socially recruited sample, N = 264; random assignment, 132 participants per condition
        - AI knowledge distillation-driven vs. conventional layoffs; a colleague is dismissed and the participant remains employed in both conditions
        - A slider task captures effort to express a policy stance; questionnaires assess organizational evaluations, job insecurity, and knowledge-hiding intentions
      diagram:
        - AI knowledge distillation-driven vs. conventional layoffs
        - Moral evaluation, organizational trust, and job insecurity
        - Policy expression and knowledge-hiding intentions
      findings:
        - Compared with conventional layoffs, AI knowledge distillation-driven layoffs elicited more opposition-oriented signed policy expression, lower moral evaluations and organizational trust, and higher job insecurity and knowledge-hiding intentions.
        - Exploratory single-mediator models suggested associations linking moral evaluation and organizational trust separately to policy expression, and job insecurity to knowledge-hiding intentions. When moral evaluation and trust were included together, only the indirect-effect interval for moral evaluation excluded zero.
        - Neither the predicted positive association between work-knowledge psychological ownership and knowledge-hiding intentions nor its moderating role in the layoff-condition effect was supported.
      limitations: The study measures knowledge-hiding intentions in a simulated scenario, not actual hiding behavior. The “two weeks later” setting is hypothetical, not a longitudinal follow-up. Mediators were not independently manipulated, so mediation analyses do not establish causal mechanisms.
      note: The manuscript is under review. No public OSF links to data, code, or materials are currently available.

    - number: "03"
      slug: moral-reminders
      title: Social Norms & Moral Decision-Making
      study_title: "From Opportunity Awareness to Action: Repeated Moral Cues and the Dynamics of Cheating"
      paper_title: "From Opportunity Awareness to Action: Repeated Moral Cues and the Dynamics of Cheating"
      status: Ongoing Research
      status_key: ongoing
      question: Do repeated moral cues affect the onset and development of cheating, and does Honesty-Humility moderate this effect?
      summary: This research examines how repeated masked moral reminders relate to cheating choices, focusing on opportunity awareness, the first act of cheating, subsequent behavior, and the moderating role of Honesty-Humility.
      design:
        - Two-group between-subjects design; a target of at least 200 valid participants, randomly assigned to moral-priming or neutral-control conditions
        - Following Joker task practice and lexical-decision priming, participants complete 40 formal Joker trials, with condition-specific masked words presented before each card draw
        - Card judgments affect actual bonuses; choices at each cheating opportunity are recorded to examine overall cheating rates and cumulative cheating curves
        - Post-task recall of opportunity awareness and measures of guilt, moral disengagement, subjective conflict, and Honesty-Humility
      diagram:
        - Repeated masked moral reminders vs. neutral cues
        - Opportunity awareness, first cheating choice, and Honesty-Humility
        - Cheating choices and cumulative cheating curves
      limitations: The research is ongoing; the design and proposed questions do not represent established findings. Opportunity-awareness timing relies on retrospective recall, so temporal analyses are exploratory. Honesty-Humility is measured, and its associations should not be interpreted as causal effects.
      note: Research is ongoing, with no conclusions to report yet. The sample target and procedures reflect the current research plan.

