profile:
  name: Bole Xuan
  kicker: Experimental Social Psychology · Organizations & Behavior
  role: Master's Student in Basic Psychology | Minnan Normal University
  lede: I study behavior and performance under social norms, goal setbacks, and layoff contexts, focusing on how social cues, individual motivation, and cognitive appraisal jointly shape judgment, attitudes, and subsequent behavior.
  tags:
    - Experimental Social Psychology
    - Organizations & Behavior
    - Motivation & Goal Pursuit
    - Moral Behavior

core_question:
  title: When environments shape goal pursuit, how do people reinterpret their situation and adjust their attitudes and behavior—and which underlying mechanisms matter most?
  keywords: Social Norms × Goal Commitment × Behavior & Decision-Making × Experimental Psychology

research:
  intro: My research examines how motivational and cognitive processes shape subsequent judgment, attitudes, and behavior under social norms, setbacks, constrained choices, and organizational change.
  streams:
    - number: "01"
      slug: reassignment-setback
      title: Setbacks, Persuasion & Goal Pursuit
      status: Under Review
      status_key: review
      question: When an original goal can no longer be pursued, how do people recommit to an alternative goal they did not initially choose?
      summary: This work compares self-persuasion with other-persuasion to examine how people rebuild goal commitment, confidence, and sustained effort after reassignment-related setbacks.
      design:
        - Three preregistered experiments
        - Student-organization role reassignment scenario
        - Hamlet theater-role reassignment scenario
        - Behavioral measures using the Charging Task and Slider Task
      diagram:
        - Reassignment-related setback
        - Self-persuasion
        - Endorsement of self-generated reasons
        - Confidence and hope
        - Goal commitment and sustained effort
      note: The manuscript is under review. The journal, sample sizes, and unconfirmed links are not publicly disclosed.
      osf_url: https://osf.io/uke2j
      osf_label: View the preregistration and materials on OSF

    - number: "02"
      slug: moral-reminders
      title: Social Norms & Moral Decision-Making
      status: In Preparation
      status_key: preparation
      question: Why does the same moral reminder affect people differently?
      summary: This research examines how moral-rule primes and achievement-motivation orientations jointly influence cheating and rule compliance.
      design:
        - 2 × 2 between-subjects experimental design
        - Achievement-motivation orientation: MAF vs. MAS
        - Priming condition: moral-rule prime vs. blank-screen control
        - University student sample, N = 213
      diagram:
        - Moral-rule reminder
        - × Achievement-motivation orientation
        - Cheating and rule compliance
      note: The manuscript is in preparation and is not presented as a published paper; no fictional journal or preprint links are shown.

    - number: "03"
      slug: distilled-colleague
      title: AI, Organizational Change & Employee Behavior
      status: Ongoing Research
      status_key: ongoing
      question: Do employees interpret replacement by AI and layoffs caused by conventional organizational factors as fundamentally different events?
      summary: This project compares AI-driven and conventional layoffs, focusing on how layoff survivors reassess knowledge, job security, organizational relationships, and subsequent work behavior.
      design:
        - AI-driven layoffs vs. conventional layoffs
        - Knowledge hiding and work attitudes
        - Perceived value of one's knowledge and job-security perceptions
        - The theoretical model and variable structure will be refined as the project progresses
      diagram:
        - AI-driven vs. conventional layoffs
        - Survivors' interpretation of the event
        - Reappraisal of knowledge, job, and organizational relationships
        - Knowledge hiding and work attitudes
      note: Conceptual and ongoing. No public data, statistical results, formal hypotheses, or submission status are available yet.

