profile:
  name: Bole Xuan
  kicker: Experimental Social Psychology · Organizations & Behavior
  role: Master's Student in Basic Psychology | Minnan Normal University
  lede: I study how people interpret and respond to goal frustration, social norms, and organizational layoffs. My work examines how social cues, individual motivation, and cognitive appraisal influence attitudes and behavior.
  academic_service: Reviewer for Psychological Reports, Current Psychology, and other journals.
  tags:
    - Experimental Social Psychology
    - Organizations & Behavior
    - Motivation & Goal Pursuit
