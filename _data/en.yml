project:
  name: paper-to-paradigm
  lede: A research toolkit for reading papers, understanding studies, and reconstructing experiments.
  summary: Starting with what participants experience, the toolkit maps a paper's theory, variables, and experimental procedures. It then checks how materials, data, and analyses fit together to support study reconstruction.
  workflow: Use paper-anatomy to understand a study's design and evidential limits, then paper-reconstruction to work through its procedures, materials, and data structure.
  tags:
    - Experimental Research
    - Behavioral Science
    - Open Science
    - AI for Research
  skills:
    - number: "01"
      name: paper-anatomy
      label: Read & Audit
      summary: Dissect theories and concepts, variables, experimental procedures, participant experience, and evidential boundaries.
    - number: "02"
      name: paper-reconstruction
      label: Reconstruct & Replicate
      summary: Rebuild sources, detailed procedures, materials, data structures, and reproducible workflows.

