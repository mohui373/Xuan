profile:
  name: Bole Xuan
  kicker: Experimental Social Psychology · Organizations & Behavior
  role: Master's Student in Basic Psychology | Minnan Normal University
  lede: I study how people interpret and respond to goal setbacks, social norms, and organizational layoffs. My work examines how social cues, individual motivation, and cognitive appraisal influence attitudes and behavior.
  tags:
