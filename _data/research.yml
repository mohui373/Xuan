streams:
  - number: "01"
    slug: reassignment-setback
    title: 受挫、说服与目标追求
    english_title: Setbacks, Persuasion & Goal Pursuit
    card_title: 调剂相关挫折：为什么自我说服更加有效？
    paper_title: "Reassignment-Related Setback: Why Self-Persuasion Works Better Because of Greater Conviction in One's Own Reasons"
    status: Under Review
    status_key: review
    osf_url: https://osf.io/uke2j
    osf_label: 在 OSF 查看该研究的预注册与材料
    question: 当原有目标无法继续时，人们如何重新投入一个并非最初选择的替代目标？
    summary: 比较自我说服与他人说服，考察个体经历调剂相关挫折后如何重建目标承诺、信心与持续投入。
    tags: [Self-Persuasion, Goal Commitment, Setbacks]
    design:
      - 三个预注册实验
      - 学生社团部门调剂情境
      - Hamlet 剧场角色调剂情境
      - Charging Task 与 Slider Task 行为测量
    diagram:
      - 调剂相关挫折
      - 自我说服
      - 对自身生成理由的认可
      - 信心与希望
      - 目标承诺与持续投入
    note: 三个预注册实验；稿件正在审稿中。

  - number: "02"
    slug: distilled-colleague
    title: AI、组织变革与员工行为
    english_title: AI, Organizational Change & Employee Behavior
    card_title: 被“蒸馏”的同事
    study_title: 被“蒸馏”的同事
    paper_title: "The Distilled Colleague: How AI Knowledge Distillation-Driven Layoffs Shape Survivor Attitudes and Knowledge Hiding"
    status: 稿件完善中
    status_key: preparation
    question: 当同事的知识被 AI agent 蒸馏、岗位却被取消时，幸存者的留任员工如何评价组织，并回应后续的知识请求？
    summary: 本研究关注组织将同事积累的经验、判断规则与工作方法编码至 AI agent，在保留其知识的同时取消其岗位的情境。通过一项预注册的沉浸式情境实验，比较这种安排与常规裁员如何影响留任员工的政策态度、组织评价和知识隐藏意向。“蒸馏”在此是经验编码与岗位替代的情境性比喻，并非特定的模型训练方法。
    tags: [AI Layoffs, Survivor Reactions, Knowledge-Hiding Intentions]
    design:
      - 一项预注册的沉浸式情境实验；单因素两水平被试间设计
      - 社会招募样本 N = 264；随机分组，两组各 132 人
      - AI 知识蒸馏式裁员 vs. 常规裁员；两组均设定同事被裁、本人留任
      - 通过滑块任务记录政策立场表达的努力，并测量组织评价、工作不安全感和知识隐藏意向
    diagram:
      - AI 知识蒸馏式裁员 vs. 常规裁员
      - 政策道德评价、组织信任与工作不安全感
      - 政策态度表达与知识隐藏意向
    findings:
      - 相较于常规裁员，AI 知识蒸馏式裁员条件下的带方向政策态度表达更偏向反对，政策道德评价与组织信任更低，工作不安全感和知识隐藏意向更高。
      - 探索性单一中介模型提示，道德评价和组织信任分别关联政策态度表达，工作不安全感关联知识隐藏意向；同时纳入道德评价与组织信任后，仅道德评价的间接效应区间排除零。
      - 工作知识心理所有权与知识隐藏意向的预期正向关联，以及其对裁员条件效应的调节作用，均未获支持。
    limitations: 本研究测量的是模拟情境中的知识隐藏意向，而非实际隐藏行为；“两周后”仅为情境设定，并非纵向追踪。中介变量未被独立操纵，中介分析不构成因果机制的确证。
    note: 实验与主要分析已完成，稿件完善中，尚未投稿。目前没有公开的 OSF 数据、代码或材料链接。

  - number: "03"
    slug: moral-reminders
    title: 社会规范与道德决策
    english_title: Social Norms & Moral Decision-Making
    card_title: "Who Ignores the Rules?"
    paper_title: "Who Ignores the Rules? Exploring Individual Differences in Cheating Behavior Under Moral Reminders"
    status: In Preparation
    status_key: preparation
    question: 为什么同样的道德提醒，对不同的人并不具有相同效果？
    summary: 研究道德规则启动与成就动机类型如何共同影响作弊行为与规则遵从。
    tags: [Moral Reminders, Achievement Motivation, Cheating]
    design:
      - 2 × 2 被试间实验设计
      - 成就动机类型：MAF vs. MAS
      - 启动条件：道德规则启动 vs. 空白屏幕控制
      - 大学生样本 N = 213
    diagram:
      - 道德规则提醒
      - × 成就动机类型
      - 作弊行为与规则遵从
    note: 稿件准备中。
